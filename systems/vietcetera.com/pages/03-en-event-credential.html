umb.webp","year":"2022","category":"Community Engagement","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_2022_Awards/kv.webp","description":["The Flavors Vietnam 2022 Awards, also known as the Bánh Mì Awards, served as the grand finale and most anticipated highlight of the Flavors Vietnam 2022 festival. The awards honored individuals, venues, and initiatives that demonstrated creativity, innovation, and community impact throughout the year.","Among the standout winners, Ngõ Ẩm was named Restaurant of the Year – People’s Choice, while Leo’s – Cocktails \u0026 Co. earned Bar of the Year – People’s Choice for its vibrant atmosphere and mixology mastery. Pizza 4P’s was recognized for its ongoing commitment to sustainability with the F\u0026B Campaign of the Year award. ","Other honorees included rising culinary talents, bar professionals, and visionary leaders in hospitality, reflecting the growth of Vietnam’s thriving F\u0026B scene."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_2022_Awards/a3bwjif5l5sl1foxv33r.webp","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_2022_Awards/uyok0ohnmvaebaxboy8z.webp","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_2022_Awards/w33sjkbcv9o1vbluqgp0.webp","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_2022_Awards/xudhshz9hvggdsxlasph.webp","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_2022_Awards/Flavors2022_020.jpg"]}},{"title":"Vietnam Innovators Summit 2022","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/Event_22_VNI.jpg","year":"2022","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/220811_VNIS_KV-banner.jpg","description":["The Vietnam Innovators Summit is a Vietcetera-initiated live event series inspired by the media firm’s top-rated business podcast Vietnam Innovators. And 2022 was our biggest one!","The Vietnam Innovators Summit event series comprises of The Conference (main event) and four Industry Insights Sessions spanning across November. The whole-day gathering, dubbed ‘The Conference, ’ saw 17 industry experts, including the US Consulate-General in HCMC Susan Burns, AIA Vietnam’s CEO Wayne Besant, and Alexander Koch from HEINEKEN Vietnam, discussing Vietnam’s massive economic and social transformations, and why Vietnam's future must be centered around sustainability."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/img-5.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Vietnam_Innovators_Summit/img-6.jpg"]}},{"title":"Press conference: Coi Mo Unitour 2022","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/Event_22_CM.jpg","year":"2022","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/UNITOUR_KV-01.jpg","description":["April 2022 - The “Cởi Mở Đi Unitour” conference officially kicked off Cởi Mở Đi Unitour in Hanoi and Ho Chi Minh City, encouraging open conversations about sex education and self-discovery among Gen Z.","At the press conference, organizers Vietcetera and Durex outlined the tour’s mission to spark open, judgment-free conversations around sex education and personal identity. The goal was not just education, but empowerment, helping students better understand themselves and foster a culture of respect, openness, and emotional well-being."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-5.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-6.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-7.jpg"]}},{"title":"Flavors Vietnam Press Conference 2022","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/Event_22_VNFB.jpg","year":"2022","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/KV-04.jpg","description":["Marking the 3rd edition of the program, Vietcetera partners with Mastercard to host Flavors Conference 2022, an upscaled version of the past year’s conferences as it expanded its welcome to 550 industry professionals, decision-makers, entrepreneurs and culinary enthusiasts in Ho Chi Minh City and Hanoi. ","Notable speakers featured Yosuke Masuko of Pizza 4P's, Vincent Mourou of Marou Chocolate, and Taku Tanaka of Kamereo. The conference provided a platform for sharing innovative ideas and strategies to navigate the evolving landscape of Vietnam's culinary scene."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/img-5.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/img-6.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/img-7.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Vietnam_Press_Conference/img-8.jpg"]}},{"title":"United Tastes: Saigon Burger Showcase","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/22_SBS.jpg","year":"2022","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/saigonburger.jpg","description":["United Tastes: Saigon Burger Showcase","The Foreign Agricultural Service of the U.S. Department of Agriculture (USDA), in partnership with the USDA Cooperators and as part of the United Tastes series, Vietcetera helped put together the \"Saigon Burger Showcase\" to promote American food and culture and the high-quality, high-value U.S. agricultural products.","Featuring Vietnam’s best of the best in the kitchen, the Saigon Burger Showcase was graced by Chef Harold Ngo, Vietnam’s first-ever Masterchef winner, Chef Tristan Ngo, dubbed the “OG (original gangster, which means original or first of its kind) Chef” in Ho Chi Minh City, and Chef Tommy Tran, who made a name for himself when he joined the phenomenally successful international chef show Top Chef."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/img-5.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/img-6.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/United_Tastes_Saigon_Burger_Showcase/img-7.jpg"]}},{"title":"Flavors Restaurant Week","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Restaurant_Week/Event_22_VRRS.jpg","year":"2022","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Restaurant_Week/KV-01.jpg","description":["A special part of Flavors 2022 series was Flavors Restaurant Week held on March 5–13, 2022","Co-hosted by Vietcetera and Mastercard, the event featured over 50 participating restaurants offering exclusive tasting menus and promotions. Diners could explore a curated selection of venues through a special map, earning stickers at each location visited.","On this special occasion, Mastercard cardholders enjoyed a 15% discount on event tickets at participating restaurants such as Ănăn Saigon, Madam Kew, Ngọc Sương Seafood \u0026 Bar, and Pizza Belga."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Restaurant_Week/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Restaurant_Week/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Restaurant_Week/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Restaurant_Week/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Restaurant_Week/img-5.jpg"]}},{"title":"Flavors Bar Week","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Bar_Week/Event_22_VNBW.jpg","year":"2022","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Bar_Week/KV-03.jpg","description":["Vietnam Bar Week 2022 was held from April 9-17, 2022, across Hanoi and Ho Chi Minh City. This time, the scope was expanded to 40 curated bars.","The week aimed to celebrate Vietnam's vibrant mixology scene and offer unique experiences to cocktail enthusiasts, through which participants were encouraged to explore the curated list of bars, collect stickers from each visited venue, and earn a special photobook upon completing the journey.","The event also featured Bar Walks, guided tours to multiple bars within walking distance, enhancing the social and interactive aspects of the week."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Bar_Week/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Bar_Week/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Bar_Week/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Bar_Week/img-4.jpg"]}},{"title":"Rising Chefs Challenge","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Rising_Chefs_Challenge/Event_22_RCC.jpg","year":"2022","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Rising_Chefs_Challenge/KV-02.jpg","description":["The Rising Chefs Challenge 2022 was a standout event in the Flavors Vietnam 2022 festival, showcasing the culinary talents of Vietnam's emerging chefs while underscoring the importance of storytelling and cultural heritage in modern cuisine. ","The competition was structured around two main challenges, with each team given a limited time to prepare and present their dishes. Among the standout participants was Chef Võ Hoàng Sang, who, along with his sous chef Ngô Trường Minh, emerged as the winner from Ho Chi Minh City.","By blending traditional flavors with innovative techniques, the participants demonstrated the rich potential of Vietnamese flavors on the global stage."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Rising_Chefs_Challenge/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Rising_Chefs_Challenge/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Rising_Chefs_Challenge/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Rising_Chefs_Challenge/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Rising_Chefs_Challenge/img-5.jpg"]}},{"title":"Taste of Australia in HCMC","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/Event_22_Taste.jpg","year":"2022","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/169_global.jpg","description":["Taste of Australia in Vietnam","From May 13 to June 5, the annual celebration of Australian premium food and beverages, dubbed the “Taste of Australia,” took place. The series of events was also about building on Australia’s international reputation as a supplier of high-quality F\u0026B products.","This year’s program kicked off with a launch in Ho Chi Minh City on 20 April through June with a range of official events run by the Australian Embassy in Hanoi, the Australian Consulate-General in HCMC, and Austrade.","The Taste of Australia partnership also featured Austrade Senior Trade Commissioner Rebecca Ball with Hao Tran speaking to a few influential names in the F\u0026B industry and entrepreneurs. Chef Chris Donnellan from Stoker Woodfired Grill \u0026 Bar, entrepreneur and environmental speaker Helly Tong, and restaurateur Le Quoc Vinh joined the conversation."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/img-5.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_HCMC/img-6.jpg"]}},{"title":"Taste of Australia in Hanoi","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_Hanoi/Event_22_SGB.jpg","year":"2022","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_Hanoi/169_global copy.jpg","description":["Taste of Australia in Vietnam","From May 13 to June 5, the annual celebration of Australian premium food and beverages, dubbed the “Taste of Australia,” took place. The series of events was also about building on Australia’s international reputation as a supplier of high-quality F\u0026B products.","This year’s program kicked off with a launch in Ho Chi Minh City on 20 April through June with a range of official events run by the Australian Embassy in Hanoi, the Australian Consulate-General in HCMC, and Austrade.","The Taste of Australia partnership also featured Austrade Senior Trade Commissioner Rebecca Ball with Hao Tran speaking to a few influential names in the F\u0026B industry and entrepreneurs. Chef Chris Donnellan from Stoker Woodfired Grill \u0026 Bar, entrepreneur and environmental speaker Helly Tong, and restaurateur Le Quoc Vinh joined the conversation."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_Hanoi/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_Hanoi/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_Hanoi/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_Hanoi/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Taste_of_Australia_in_Hanoi/img-5.jpg"]}},{"title":"Flavors Gala Dinner","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Gala_Dinner/Event_22_FVG.jpg","year":"2022","category":"Networking","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Gala_Dinner/220630_FPD_NormalMenu_slideshow.jpg","description":["The Flavors Gala Dinner 2022, an exclusive invitation-only event, offered a remarkable culinary experience curated by some of Vietnam’s most celebrated chefs and restaurateurs. Guests were taken on a multi-sensory journey through an originally crafted multi-course menu, combining innovation and cultural storytelling that served as a meaningful finale to the Flavors Vietnam 2022 series."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Gala_Dinner/IMG_8341.HEIC","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Gala_Dinner/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Gala_Dinner/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Flavors_Gala_Dinner/img-4.jpg"]}},{"title":"Viglacera Event - Touch the Future","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Viglacera_Event/Event_22_TTF.jpg","year":"2022","category":"Partnership Events","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Viglacera_Event_Touch_the_Future/VIGLACERA_Header.jpg","description":["Centered on the theme 'Touch the Future', Viglacera's \"Touch the Future\" event, held at VietBuild 2022 in Ho Chi Minh City, showcased the company’s latest innovations in building materials. The event was an opportunity to connect and exchange ideas on the different trends in the architecture field, new design technologies, and how the COVID-19 pandemic and climate change have reshaped the industry as a whole.","The event captured insights on the application and development of green building materials, which has become prominent in building a green real estate market."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Viglacera_Event/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Viglacera_Event/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Viglacera_Event/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Viglacera_Event/img-4.jpg"]}},{"title":"Office Haus Groundbreaking Ceremony","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Groundbreaking_Ceremony/22_OH2.jpg","year":"2022","category":"Partnership Events","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Groundbreaking_Ceremony/OfficeHaus_169.jpg","description":["March 7, 2022 - In partnership with Vietcetera, OfficeHaus held its groundbreaking ceremony in Celadon City, marking the start of construction on a Bauhaus-inspired office building focused on functionality, simplicity, and user-friendly design. The event welcomed key stakeholders, including OfficeHaus, COFICO, and project partners.","Designed for modern professionals, OfficeHaus features Saigon’s largest floorplate at 2,500 sqm and is LEED Gold certified for sustainability. Despite post-pandemic challenges, the project managed to move forward with the groundbreaking, reinforcing its commitment to building a future-ready workspace."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Groundbreaking_Ceremony/220224-Online-invitation.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Groundbreaking_Ceremony/Office Haus x VCT_Groundbreaking event_105.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Groundbreaking_Ceremony/Office Haus x VCT_Groundbreaking event_107.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Groundbreaking_Ceremony/Office Haus x VCT_Groundbreaking event_41.jpg"]}},{"title":"Office Haus Topping up Ceremony","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Topping_up_Ceremony /22_OH1.jpg","year":"2022","category":"Partnership Events","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Topping_up_Ceremony /OH TOPPING OUT-01.jpg","description":["August 30 - OfficeHaus celebrated a major milestone in its construction journey with a topping-out ceremony, marking the critical transition from structural work to the interior and finishing phases of its modernist office building design.","The ceremony was attended by key partners including Gamuda Land, one of the region’s leading landowners and real estate developers, COFICO as the general contractor, Artelia Vietnam as the construction management firm, and Korn Architects, the visionary behind OfficeHaus’ seamless, Bauhaus-inspired minimalist design. The ceremony was curated by Vietcetera, reflecting our thriving partnerships with visionary leaders that are delivering works that strive for the future. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Topping_up_Ceremony /img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Topping_up_Ceremony /img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Topping_up_Ceremony /img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Topping_up_Ceremony /img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Office_Haus_Topping_up_Ceremony /img-5.jpg"]}},{"title":"Coi Mo Di Unitour","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Coi_Mo_Di_Unitour/Event_22_CM.jpg","year":"2022","category":"Tour","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Coi_Mo_Di_Unitour/UNITOUR_KV-01.jpg","description":["'A journey to discover the real you' is the goal of Cởi Mở Đi Unitour. With a desire to take young people on a journey to answer many questions about themselves, Durex partnered with Vietcetera to organize the Cởi Mở Đi Unitour in Hanoi and Ho Chi Minh City. Each stop was an opportunity for participants to discover themselves and uncover the potentials within.","2022 has seen two batches of tours from May to October; the program went to 16 universities in Hanoi and Ho Chi Minh City to inspire students to discover and express themselves through diverse experiences. The future ahead is bright, we hope to reach out to more schools across Vietnam, sharing the opportunity to many more students."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-5.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-6.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Press_conference_Coi_Mo_Unitour/img-7.jpg"]}},{"title":"AIA Webinar Series","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/AIA_Webinar_Series/AIA4-ARTICLE.jpg","year":"2022","category":"Webinar","detail":{"keyvisual":"","description":["In 2022, Vietcetera partnered with AIA Vietnam to produce a four-part, C-suite–level webinar series exploring how technology is reshaping financial services. Over four sessions—covering industry outlook, customer experience, digital transformation, and platform partnerships—we convened 17 senior leaders, including AIA Vietnam CEO Wayne Besant, McKinsey Vietnam Managing Partner Bruce Delteil, Mastercard Country Manager Winnie Wong, and Momo CFO Manisha Sha.","The series recorded 850+ live attendees, 5,000+ YouTube replays, and reached 363,000 people across Vietcetera’s channels, demonstrating our ability to deliver thought-leadership content at larger scale while maintaining broadcast-quality production and flawless execution for a world-class brand."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/AIA_Webinar_Series/AIA3invitation-01.png","https://img.vietcetera.com/uploads/images/event-credential/works/2022/AIA_Webinar_Series/AIAposter4-01.png"]}},{"title":"Artist Talk - \"Hồi Sinh\" Exhibition","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/22_Hồi-sinh.jpg","year":"2022","category":"Workshop","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/hoisinh_FB-Event-Cover.jpg","description":["The Artist Talk event is part of the \"Hoi Sinh\" (Revival) exhibition in partnership with Lotus Gallery, which runs from December 16th to December 25th. The talk with curator Xuân Phượng and artist Đinh Quang Hải (Hải Tre) took place on December 18th to share the ideas and process behind the exhibition.","The \"Hoi Sinh\" exhibition presented a parallel display of works by the late artist Phạm Thanh Tâm (1933 - 2019)—known as the man who \"told war stories through painting\"—and contemporary artist Hải Tre. Before creating his collection, Hải Tre spent four months traveling through former war-torn \"lands of fire\" such as Quảng Bình, Quảng Trị, and Hà Tĩnh. Everywhere he went, he documented life in peacetime through colors and images. The journeys of the two artists had taken place at different times, but they converged as extended diaries of the lands, current events, and people they encountered."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-1.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-2.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-3.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-4.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-5.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-6.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-7.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-8.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-9.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2022/Artist_Talk_Hoi_Sinh_Exhibition/img-10.JPG"]}},{"title":"Office Haus Seminar","img":"","year":"2022","category":"Seminar","detail":{"keyvisual":"","description":["As a curator and moderator, Vietcetera collaborated with OfficeHaus to host a dynamic seminar on attracting and engaging Gen Z and Millennial talent, aligning with its vision to create future-ready workspaces that resonate with the next generation of professionals. The event included panel discussions and insightful converations on key themes shaping the modern workplace.","Guest speakers included Hao Tran, CEO of Vietcetera, Thao Tran, Head of HR at Pizza Hut Digital Ventures, Alexis Pham, Chief People Officer at Home Credit Vietnam, and Abhishek Mathur, Vice of President of Human Resources at VNG Corporation. By understanding what drives Gen Z and Millennials, OfficeHaus aims to support companies in creating experiences that attract top talent and build long-term engagement in a rapidly changing labor market."],"landingPage":"","media":[]}}],"2023":[{"title":"Yêu Lành Offline","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Yeu_Lanh_Offline/Event_23_YL.jpg","year":"2023","category":"Community Engagement","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Yeu_Lanh_Offline/20232509_Yêu Lành Offline_KV ngang.jpg","description":["Yêu Lành” offline event is a special live gathering organized by Vietcetera and Thầy Minh Niệm to celebrate 2 seasons and the 1-year anniversary of broadcasting of the “Yêu Lành” podcast, a podcast about healing, love, and finding ourselves.","With the attendance of special guests including Thầy Minh Niệm, Mrs. Linh Thai - Thái Vân Linh and host Thùy Minh, the event recorded 1,600 offline and 1,000 online attendees. It was a unique opportunity for regular listeners of the show to gather, share their insights, learn about themselves and their journey of love. "],"landingPage":"https://vietcetera.com/vn/bo-suu-tap/yeu-lanh","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Yeu_Lanh_Offline/DANN3470.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Yeu_Lanh_Offline/YeuLanh_Offline_KhooaNguyen_0295.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Yeu_Lanh_Offline/YeuLanh_Offline_KhooaNguyen_0617.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Yeu_Lanh_Offline/YeuLanh_Offline_KhooaNguyen_0647.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Yeu_Lanh_Offline/YeuLanh_Offline_KhooaNguyen_1268.jpeg"]}},{"title":"Flavors Awards 2023","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/Event_23_FLA.jpg","year":"2023","category":"Community Engagement","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/FV-2023_05-VRBA.jpg","description":["The theme of Flavors Vietnam 2023 is profoundly symbolic of the local F\u0026B indsutry's emerging potential: “Taking Vietnam’s Food \u0026 Beverage Industry To The Next Level.” ","For the first time, Flavors Vietnam 2023 Awards, also known as the Bánh Mì Awards, expanded its list of categories to shine a spotlight on outstanding young leaders. Chef Phan Lê Anh Tú, Head Chef and co-founder of Ngõ Ẩm, a fusion bistro in Hanoi, received the title Young Leader of the Year.","The award continued to honor and celebrate the most creative and highly innovative players in the industry, those who have pushed boundaries to put Vietnam on the global culinary map."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/TXT50812.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/TXT50950.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/TXT51132.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/TXT51289.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/TXT51360.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Awards_2023/Flavors VN 2023_BOBBYVUX_87.JPG"]}},{"title":"Flavors Conference 2023","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/Event_23_FVC.jpg","year":"2023","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/FV-2023_01-PressConference.jpg","description":["March, 2023 - Flavors Conference 2023, themed “Taking Vietnam’s Food \u0026 Beverage Industry to the Next Level”, marked Vietcetera’s 4th annual series celebrating the dynamic Vietnamese F\u0026B industry, attracting nearly 1,000 attendees across two key events held in Hanoi and Ho Chi Minh City.","With Mastercard continuing as the official payment partner, the conference showcased keynote sessions on the current state of Vietnam’s F\u0026B industry, insights on emerging customer trends, and strategies of expanding Vietnamese F\u0026B brands into international markets."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/20230310 Vietcetera Flavors Conference Hanoi Speakers Highlights-326.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/20230310 Vietcetera Flavors Highlights Phong Le-4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/Flavors VN 2023_BOBBYVUX_166.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/Flavors VN 2023_BOBBYVUX_47.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/Flavors VN 2023_KhooaNguyen_286.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Conference_2023/Flavors VN 2023_KhooaNguyen_343.jpeg"]}},{"title":"Vietnam ESG Investor Conference 2023","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/Event_23_ESG.jpg","year":"2023","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/230529_ESG_KV.jpg","description":["The 2023 Vietnam ESG Conference, organized by Vietcetera and Raise Partners, brought together over 350 participants from 20+ countries, including ambassadors, investors, and SMEs. The 2-day event explored the future of ESG investing in Vietnam, addressing the country’s social and environmental challenges.","The conference also featured an outstanding lineup of key speakers such as H.E. Karl Van den Bossche, Ambassador of Belgium to Vietnam, Sarah Hooper, Consulate-General of Australia in Ho Chi Minh City, and Michael Traill AM, Founder of Social Ventures Australia, discussing topics like ESG financing and building a resilient, sustainable economy. The conference also hosted industry panels, workshops, and networking sessions to foster collaboration."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/ESG_BOB_197.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/ESG_Press Conference_KhooaNguyen_018.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/ESG_Press Conference2_KhooaNguyen_052.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/ESG_Press Conference2_KhooaNguyen_183.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/LEE_6369.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/LEE_7099.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/LEE_7182.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Vietnam_ESG_Investor_Conference_2023/LEE_7277.JPG"]}},{"title":"Flavors 2023 - Gala dinner","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_2023_Gala_dinner/Event_23_FGD.jpg","year":"2023","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_2023_Gala_dinner/FV-2023_06-GalaDinner.jpg","description":["Flavors Vietnam 2023 Gala Dinner marked the finale of Vietcetera’s 4th annual celebration of Vietnam’s dynamic F\u0026B industry via the Flavors Vietnam event series.","Held in Ho Chi Minh City, the gala dinner served as a platform to celebrate the achievements and outstanding contributions to Vietnam's F\u0026B industry, honoring those who have contributed to the country’s culinary scene.","The culinary team was led by Chef Anh Tu, Head Chef of Ngoặm bistro, featuring a curated menu that showcased the rich flavors of Vietnamese cuisine and a touch of culinary diversity."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_2023_Gala_dinner/Gala Dinner_2023_KhooaNguyen_129.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_2023_Gala_dinner/GALA Dinner_FlavorVietnam_Bob_125.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_2023_Gala_dinner/GALA Dinner_FlavorVietnam_Bob_140.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_2023_Gala_dinner/GALA Dinner_FlavorVietnam_Bob_173.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_2023_Gala_dinner/LORD-06228.JPG"]}},{"title":"Flavors Restaurant Week","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Restaurant_Week/Event_23_FVRS.jpg","year":"2023","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Restaurant_Week/FV-2023_03-RW.jpg","description":["Flavors Restaurant Week 2023 spotlighted Vietnam’s rich and evolving dining culture, gathering food lovers across Hanoi and Ho Chi Minh City to explore curated menus and signature dishes from some of the country’s most exciting culinary names.","Led by Vietcetera as part of the broader Flavors Vietnam 2023 campaign, the week-long celebration extended the invitation to customers to rediscover the meaning of dining out through exploring diverse restaurants and enjoying exclusive perks."],"landingPage":"","media":[]}},{"title":"Flavors Bar Week","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Bar_Week/Event_23_BW.jpg","year":"2023","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Bar_Week/FV-2023_04-BW.jpg","description":["Flavors Restaurant and Bar Week 2023, one of the most anticipated events of local food enthusiasts, returned in 2023, offering customers the chance to sample innovative mixes from  leading bartenders in more than 70 unique venues across Hanoi, Ho Chi Minh City, and Danang.","Different from the previous years, the 2023 experience extended to other parts of Vietnam, such as the beautiful beach area Danang, with an aim to reach more customers and invite them on an unique experience of bar-hopping and cocktail indulgence, which have become essential aspects of modern life. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Bar_Week/CRUZ9750.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Flavors_Bar_Week/CRUZ9855.jpg"]}},{"title":"Rising Chefs Challenge","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/Event_23_RC.jpg","year":"2023","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/FV-2023_07-RCC.jpg","description":["Rising Chef Challenge 2023, one of the most exciting highlights of the Flavors Vietnam 2023, featured 10 aspiring chefs go head-to-head in the long awaited culinary competition.","With the theme “Elevating your favorite childhood dishes,” contestants were challenged to breathe new life into their classic Vietnamese favorites and incorporate new techniques and ingredients to create a culinary masterpiece.","The jury featured industry icons including Chef Trụ Lang, Founder \u0026 Head Chef at MÙA Hội An and MÙA Craft Sake, Chef Hoàng Tùng, Co-founder \u0026 Head Chef at TUNG Dining and Å by TUNG and Helen Lê, Chef \u0026 Blogger at Helen’s Recipes. After an intense match, Trịnh Tuấn Dũng emerged as the ultimate victor, winning the title of Rising Chef Champion."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/128-7RI00832.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/196-7RI01116.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/RCC_BOBBY_165.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/RCC_BOBBY_180.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/RCC_BOBBY_236.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/RCC_BOBBY_267.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Rising_Chefs_Challenge/RCC_BOBBY_343.JPG"]}},{"title":"Chef Takeover - Table 1","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/23_CTO_t1.jpg","year":"2023","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/ChefTakeover_KeyVisual-01.png","description":["The Chef Takeover - Vietcetera Edition is our premier culinary series dedicated to creating exclusive, collaborative fine-dining events.","First introduced in 2023, the inaugural edition featured the theme \"Modern Singapore Meets Modern Vietnam.\" This event brought together two of Asia's most celebrated chefs for an unprecedented 4-hands collaboration:- Chef Peter Cuong Franklin (Anan Saigon: #40 Asia's 50 Best, One Michelin Star)- Chef Han Liguang (Labyrinth: #11 Asia's 50 Best, One Michelin Star) This initiative demonstrates our capacity to unite world-class talent and produce a sophisticated culinary experience, blending distinct cultures and generating significant industry recognition."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/0L0A0241.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/0L0A0336.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/0L0A0345.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/0L0A0530.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/0L0A0808.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/LEE_0898.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/LEE_0918.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/LEE_1073.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/LEE_1091.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/LEE_1230.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/LEE_1285.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_1/LEE_1421.JPG"]}},{"title":"Chef Takeover - Table 2","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/23_CTO_t2.jpg","year":"2023","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/ChefTakeoverNov_KeyVisual-01.jpg","description":["Following its successful first season, Chef Takeover - Vietcetera Edition returns, uniting two acclaimed chefs for a unique dining experience. Themed \"Melting Pot - A Joyful Culinary Voyage!\", the event features Chef Hoang Tung of Vietnam's TUNG dining and Chef Lee Zhe Xi of Malaysia's Eat and Cook. The two award-winning, Michelin-recognized chefs will guide diners on an exquisite culinary journey from Vietnam to Malaysia, showcasing a fusion of distinct and vibrant flavors in a world-class gastronomic setting."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC00709.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC00754.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC00765.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC01557.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC01598.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC01953.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC02039.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC02180.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC02438.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC02828.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC03211.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC03366.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC03423.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Chef_Takeover_Table_2/DSC03642.jpeg"]}},{"title":"‘Ciao-Parole d'italiano - Y Nghia’ Award Night","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/Event_23_Ynghia.jpg","year":"2023","category":"Diplomatic Events","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/YNghia_Thumbnail_16x9.jpg","description":["‘Ciao-Parole d'italiano - Y Nghia Award Night' celebrated the finalists of the 'Ý Nghĩa: Tìm Nghĩa – Hiểu Ý' competition, part of the Week of the Italian Language in the World, held annually during the third week of October.","The competition was led by the Consulate-General of Italy to invite language enthusiasts to explore the meaning of Italian words through personal stories, art, and language. Curated by Vietcetera, the ‘Ciao – Parole d’italiano: Ý Nghĩa Award Night' went beyond cetificates and prizes, celebrating a shared love for languages and the importance of finding meaning in language learning."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/DSC04500.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/YNGHIA_EVENT_BOB_130.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/YNGHIA_EVENT_BOB_132.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/YNGHIA_EVENT_BOB_57.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/YNGHIA_EVENT_BOB_64.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/YNGHIA_EVENT_BOB_89.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Y_Nghia_Award_Night/YNGHIA_EVENT_BOB_99.JPG"]}},{"title":"CFYC Festival - Podcast station","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/CFYC_Festival_Podcast_station/Event_23_CFYC.jpg","year":"2023","category":"Experiental","detail":{"keyvisual":"","description":["October 2023 – California Fitness \u0026 Yoga, a leading name in Vietnam’s fitness industry, hosted one of the country’s largest fitness and music festivals, drawing 20,000+ attendees through a vibrant lineup of outdoor activities. ","As part of the movement, Vietcetera introduced the on-site \"Thương Thân\" podcast station, a space for self-reflection and honest conversation. Attendees were invited to take a short self-assessment and share personal thoughts on health, wellness, and living a fulfilling life.","The \"Thương Thân\" station reminded us that behind even the simplest, everyday stories lie genuine thoughts and unfiltered emotions, often hidden in the rush of daily life."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/CFYC_Festival_Podcast_station/DSC01173.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/CFYC_Festival_Podcast_station/DSC01197.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/CFYC_Festival_Podcast_station/DSC01218.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/CFYC_Festival_Podcast_station/VHM01449.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/CFYC_Festival_Podcast_station/VHM01456.jpeg"]}},{"title":"Mastercard Customer Forum 2023","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/Event_23_Mastercard.jpg","year":"2023","category":"Partnership Events","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/Customer Forum LED.jpg","description":["With the theme “A World Beyond Cash – Accelerating, Innovating, Connecting you to Priceless Possibilities,” Mastercard Customer Forum helped sketch the big picture of the current payment landscape, drawing the ways how Mastercard and its key partners join hands to increase the capability of payment and better serve the population of 100-million people in Vietnam.","Vietcetera curated the gala dinner and welcoming reception, from design requirements and audio-visual support to hosting the actual event and tailoring the key people for the gathering. Mastercard’s partnered with Vietcetera for a while now, and in the coming year, there will be more collaborations to come."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A5165.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A5244.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A5282.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A5986.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A6205.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A6646.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A6673.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/2B7A6928.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Mastercard_Customer_Forum_2023/image (1).png"]}},{"title":"Cởi Mở Lên - Durex","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Coi_Mo_Len_Durex/Event_23_Coimolen.jpg","year":"2023","category":"Partnership Events","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2023/Coi_Mo_Len_Durex/CML SHOW 2 KV.png","description":["“Cởi Mở Lên” is a bold and unconventional 3-day music event series curated by Vietcetera, in partnership with Durex, designed to challenge expectations and ignite curiosity.","The event was unique in its 3 Nos:- No lineup announcement- No venue reveal- No schedule drop This meant attendees were invited to participate in the event ‘blindfolded’, not knowing what to expect. The event was a unquie blend of mystery, artistry, and movement, inviting attendees to ‘open up’ and express themselves freely."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2023/Coi_Mo_Len_Durex/Copy of DSC09364.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Coi_Mo_Len_Durex/Copy of DSC09423.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Coi_Mo_Len_Durex/Copy of DSC09433.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Coi_Mo_Len_Durex/Copy of DSC09630.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Coi_Mo_Len_Durex/Copy of DSC09724.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2023/Co 1 to July 14 in collaboration with the World Class Cocktail Festival, the event offered a unique journey. With 4 guest shifts, 2 weeks of Bar Week experiences, and 12 days of our new Bar Walk activity, participants discovered 47 exceptional bars across Hanoi and Ho Chi Minh City, truly immersing themselves in this unique journey."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Bar_Week_2024/CRUZ1866.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Bar_Week_2024/CRUZ4307.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Bar_Week_2024/CRUZ4406.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Bar_Week_2024/CRUZ9721.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Bar_Week_2024/CRUZ9887.jpg"]}},{"title":"Flavors Restaurant Month 2024","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/Event_24_FVRS.jpg","year":"2024","category":"Activation","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/FVrestaurant-04.jpg","description":["In 2024, Flavors Restaurant Week returned with a bold new identity - Flavors Restaurant Month, transforming from a one-week spotlight into a full month-long culinary celebration. This evolution reflected Vietcetera’s commitment to deepening engagement and amplifying the dining experience across Vietnam’s vibrant food scene.","The extended celebration featured over 50 of Vietnam’s top restaurants across Ho Chi Minh City and Hanoi, making it one of the largest restaurant-driven events of its kind in the country. The transformation from a short week to a longer celebration allowed more diners to participate and enjoy curated tasting menus, special offers, and tailored experiences to diverse preferences and tastes. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/_KDN8327.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/_KDN8476.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/DSCF2138.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/DSC04138.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/DSC06461.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/DSC06683.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/DSC07209.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/_NMH6036.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/DSCF6559.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Restaurant_Month_2024/z6353631899464_65d44b1a414d3afbd9161dc567e19ca1.jpg"]}},{"title":"Flavors Awards 2024","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/Event_24_FVA.jpg","year":"2024","category":"Community Engagement","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/KV_award_2.jpg","description":["As part of Flavors Vietnam 2024, the Flavors Awards - formerly known as the Flavors Vietnam Restaurant \u0026 Bar Awards, honor the food‑and‑beverage pioneers who are shaping Vietnam’s culinary landscape. Reimagined for 2024, the ceremony debuted under its new banner during the Flavors Festival, held on December 7–8 in Ho Chi Minh City.","The program features two nomination segments: the Flavors Collection, comprising five publicly voted categories, and the Grand Prize, decided by an expert panel. Together, these segments celebrate venues, teams, and individuals whose work resonates deeply with diners and delivers lasting impact across the industry.","This year’s edition attracted an impressive 21,790 public votes nationwide. From these responses, the top ten nominees in each category were shortlisted, culminating a total of 50 winners who were honored during the ceremony."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/DEE04095.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/DEE05034.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/LOG_5694.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/LOG_5977.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/LOG_6018.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Awards_2024/LOG_6107.jpg"]}},{"title":"Overseas Vietnamese Summit 2024","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/Event_24_OV.jpg","year":"2024","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/20240117_OV_KV.jpg","description":["Overseas Vietnamese Summit 2024, hosted by Vietcetera in partnership with the Overseas Vietnamese (OV) community, sent a powerful homecoming message that brought together the Vietnamese overseas community back to their roots and where the future is being shaped.","The summit attracted 600+ participants across 3 days from more than 40 countries, including professionals, entrepreneurs, and creatives, sparking connections and cultural rediscovery among talents. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/ANH00420.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/ANH00422.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/ANH00990.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/ANH01244.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/ANH01351.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Oversea_Vietnamese_Summit_2024/ANH01404.jpg"]}},{"title":"Vietnam ESG Investor Conference 2024","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietnam_ESG_Investor_Conference_2024/Event_24_ESG.jpg","year":"2024","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietnam_ESG_Investor_Conference_2024/2024_ESG_KV.jpg","description":["The 2024 Vietnam ESG Investor Conference brought together 500+ participants and 80 industry-leading experts to discuss and promote sustainable development in Vietnam. Held on May 16–17, 2024, at the New World Saigon Hotel in Ho Chi Minh City, the conference focused on the theme “Building a Resilient Future for Vietnam”.","The conference marked Vietnam's movement - stepping onto the world stage as a rising voice in sustainability. And for those who were there, it was a front-row seat to the future."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietnam_ESG_Investor_Conference_2024/2024_ESG_KV.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietnam_ESG_Investor_Conference_2024/DAY1_BOB_111.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietnam_ESG_Investor_Conference_2024/DAY1_BOB_46.JPG","https://img.vietcetera.com/uploads/images/event-credential/work
