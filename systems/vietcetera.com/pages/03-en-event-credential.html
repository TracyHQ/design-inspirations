2024/FLAVOR_0304.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Conference_2024/FLAVOR_0426.JPG"]}},{"title":"Chef Takeover - Table 3","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/23_CTO_t3.jpg","year":"2024","category":"Culinary Showcase","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/KV.jpg","description":["The acclaimed Chef Takeover series returned in 2024 with its third table, which is an exclusive and premium cultural culinary exchange event organized by Meliã Hanoi in collaboration with Vietcetera. With the theme \"A Symphony Of Flavors, A Harmony Of Cultures,\" Chef Takeover featured a quintessential fusion of Chinese and Vietnamese cuisines, elevating local ingredients into new culinary masterpieces.","This special event is a wonderful collaboration between Cham Cantonese Kitchen and two prestigious chefs: Chef Le Thi Thai, Dimsum Head Chef at Cham Cantonese Kitchen - Melia Hanoi and Guest Chef - Chef Summer Le, Founder and Head Chef at Nén Danang and Nén Light Saigon"],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01006.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01090.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01094.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01097.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01122.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01226.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01249.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01365.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01515.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01569.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01692.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01700.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Chef_Takeover_Table_3/LV_01739.jpg"]}},{"title":"5AM Concert","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/Event_24_5AMconcert.jpg","year":"2024","category":"Experiental","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/240111_5AM_KV-ngang.jpg","description":["From Snooze to Groove at 5AM","As the name suggests, 5AM is no ordinary concert - it's an unique outdoor music experience that kicks off at sunrise, starting the day with music.","January 2024, 5AM Concert made its debut with the collaboration between Vietnam Airlines, SpaceSpeakers Group, and Vietcetera. The event attracted over 1,500 early risers with jogging loops, yoga sessions, and a dose of mindful calm, before building up to an electrifying live music party. ","In Hanoi, the experience went above and beyond - 5AM featured a Heritage Race with over 5,000 attendees, taking participants on a multi-sensory journey through renowned historical destinations in Hanoi, reiterating that it was more than just a regular music event. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/5AM_KhooaNguyen_074.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/5AM_KhooaNguyen_082.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/5AM_KhooaNguyen_175.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/5AM_KhooaNguyen_191.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/5AM_KhooaNguyen_271.jpeg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/5AM_Concert/5AM_KhooaNguyen_309.jpeg"]}},{"title":"RadioOnTV Launch Party","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/Event_24_Radioon.jpg","year":"2024","category":"Experiental","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/Artboard 1.png","description":["The 24/7 Music Entertainment Channel RadioOnTV Is Now On Air!","With the collaboration of four major players—Vietcetera, SpaceSpeakers, BEAT Network, and Dentsu Redder—RadioOnTV, a 24/7 broadcasting platform featuring high-quality content, officially \"debuts.\"","RadioOnTV broadcasts continuously with engaging and fresh content. Over 24 hours each day, viewers can enjoy 4 hours of interesting lifestyle content, 10 hours of curated music playlists, and 10 hours of top podcasts.","More than just a destination for quality content, RadioOnTV also aims to create a common platform for the art-loving community, launching new artists into greater public recognition."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/4Q4A0901.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/4Q4A0948.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/4Q4A1526.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/4Q4A1679.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/DSC06883.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/DSC07241.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/RadioOnTV_Launch_Party/KHO_9081.jpg"]}},{"title":"Flavors Vietnam 2024 x HOZO International Food Fest","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/Event_24_FVVN.jpg","year":"2024","category":"Festival","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/FV24_KvFestival.jpg","description":["A Vibrant Feast For The Senses!","December 13-15 2024, Flavors Vietnam 2024 x HOZO International Food Fest created a vibrant festival atmosphere that drew thousands of visitors to Nguyễn Huệ Walking Street.","Flavors Vietnam, an annual F\u0026B series organized by Vietcetera and Mastercard, celebrates the contributions and achievements of Vietnam's F\u0026B industry. This 2024, Flavors Vietnam collaborated with HOZO (Ho Do), Vietnam's largest community music festival, to deliver a groundbreaking music and food festival.","The event featured captivating performances by over 250 artists and more than 60 F\u0026B booths, offering a wholesome experience for attendees of all ages."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/LOG_6320.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/LOG_6379.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/LOG_6551.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/MAS_289.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/MAS_358.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Flavors_Vietnam_2024_HOZO/MAS_396.jpg"]}},{"title":"Memorandum of Understanding and the announcement of the co-badged card between NAPAS, Mastercard, and participating banks","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/NAPAS_Mastercard/Event_24_Napas.jpg","year":"2024","category":"Partnership Events","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/NAPAS_Mastercard/mcnapas2.jpg","description":["October 15, 2024 - Mastercard, a global technology company in the payments industry, the National Payment Corporation of Vietnam (NAPAS), and nine first banks have announced a Memorandum of Understanding (MoU) to introduce the first NAPAS – Mastercard co-badged card in Vietnam. The co-badged card, equipped with contactless payment features, is widely accepted globally, including in Vietnam. This single card offers cardholders a seamless, secure, and convenient payment experience."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/NAPAS_Mastercard/_ABC7525.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/NAPAS_Mastercard/DSC06650.jpg"]}},{"title":"Vietcetera Goes Abroad - US 2024","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/Event_24_VGU.jpg","year":"2024","category":"Tour","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/VCTabroad_kv-01.jpg","description":["Vietcetera Goes Abroad: US Chapter (Currently Vietcetera Open)","July 25-28, 2024 - As part of its Vietcetera Open global series, Vietcetera Goes Abroad: US Chapter, in cooperation with the National Association of Asian American Professionals (NAAAP), made its debut in Houston, Texas. ","The Chapter featured influential voices including Vietcetera host, Thuy Minh, creative entrepreneur Chris Do from The Futur, and acclaimed Vietnamese American film director and producer Bao Nguyen. Chris Do, an award-winning designer, shared his personal journey of embracing his Vietnamese American identity and how it shaped his creative career. Bao Nguyen spoke on the importance of Asian American representation in film, offering powerful insights into his work as a storyteller and director."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/DSC00893.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/DSC04806.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/DSC07579.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/DSC07641.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/DSC08026.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/DSC08143.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Open_US/DSC08852.jpg"]}},{"title":"Vietcetera Goes Aboad - Japan","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/VCT_JP_Japan_KV1.jpg","year":"2024","category":"Tour","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/Event_24_VGJ.jpg","description":["Vietcetera Goes Abroad: Japan Chapter","September 14, 2024 - ‘Vietcetera Goes Abroad’ global series is an innovative event series organized by Vietcetera with the idea of traveling the world to foster cultural exchange, professional networking, and encourage meaningful global conversations. ","After successfully kicking off in the US, the Tokyo Chapter continued to offer in-depth insights into the work cultures and employment landscapes of Japan and Vietnam. It featured founders and thought leaders such as Mr. Yosuke Masuko and Mrs. Sanae Masuko, co-founders of Pizza 4Ps, Mr. Do Van Khac, CEO of FPT Japan, Mr. Santoshi Kuriga, Head of Global Investments Reazon Capital, and Mrs. Huong Tran, Investor at Pacific Light, sharing valuable insights for entrepreneurs and established businesses to navigate the dynamic business markets. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH00453.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH00669.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH00698.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH00816.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH00926.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH01043.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH01240.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Vietcetera_Goes_Aboad_Japan/ANH01448.jpg"]}},{"title":"Vietnam ESG Investor Conference 2024 - Field Trip","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/ESG_2024_Field_Trip/DSC03385.jpg","year":"2024","category":"Tour","detail":{"keyvisual":"","description":["May 15  - As part of the wider Vietnam ESG Investor Conference 2024, a special Field Trip was offering investors a firsthand look at ESG practices in Vietnam. Participants visited Phuc Sinh Corporation, a leader in sustainable agriculture, to observe real-world applications of ESG principles and engage with local stakeholders.","Organized by Raise Partners and Vietnam Innovators by Vietcetera, the trip supported the conference theme, “Building a Resilient Future for Vietnam,” by highlighting the role of practical, on-the-ground efforts in driving sustainable development."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/ESG_2024_Field_Trip/DSC03054.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/ESG_2024_Field_Trip/DSC03103.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/ESG_2024_Field_Trip/DSC03182.jpg"]}},{"title":"OV Summit 2024 - Company Tour","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/24_OV1.jpg","year":"2024","category":"Tour","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/20240117_OV_KV.jpg","description":["January 2 - A highlight of the OV Summit 2024 featured a Company Tour, offering participants an inside look at leading Vietnamese companies like Vinamilk, Masan Group, and Techcombank. ","In addition to traditional corporate visits, the tour included stops at Sun Life’s De La Sól wellness space and the Vietcetera podcast studios, highlighting Vietnam’s growing focus on lifestyle, media, and employee well-being. The experience concluded with a curated dinner at Anan Saigon, where guests enjoyed modern interpretations of Vietnamese cuisine by renowned chef Peter Cường Franklin. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/DSC06597.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/DSC06700.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/DSC06706.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/DSC06714.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/DSC06730.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/OV_Summit_2024_Company_Tour/DSC06856.jpg"]}},{"title":"Lumina Leadership","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Lumina_Leadership/Event_24_Illuminate.jpg","year":"2024","category":"Workshop","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Lumina_Leadership/2160x3840-KV_lumina.png","description":["Illuminate Yourself","September 1, 2024 - Vietcetera and Lumina Spark co-hosted Illuminate Yourself, a leadership seminar focused on self-awareness and navigating today’s evolving business landscape. Featured speakers included Cat-Thao Nguyen, Leadership Coach and Lumina Vietnam Partner, and Dr. Stewart Desson, Founder and Global CEO of Lumina Learning. It was more than just a seminar, it was an invite to attendees to embark on their self-finding journey and discover the 'illuminating' sparks in their career and life. "],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Lumina_Leadership/DSC00971.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Lumina_Leadership/DSC01027.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Lumina_Leadership/DSC01093.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Lumina_Leadership/DSC01108.jpg"]}},{"title":"Brewing up with Chris Do - Personal Branding","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Brewing_up_with_Chris_Do_Personal_Branding/Event_24_ChrisDo.jpg","year":"2024","category":"Workshop","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2024/Brewing_up_with_Chris_Do_Personal_Branding/169.jpg","description":["Brewing Up with Chris Do – Personal Branding","May 2025 - Vietcetera hosted a special edition of Brewing Up featuring Chris Do, an Emmy Award-winning designer, educator, and founder of The Futur. Centered around the theme of personal branding, the session offered a deep dive into how individuals can harness the power of their story, skills, and presence to build a brand that resonates in today’s economy."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2024/Brewing_up_with_Chris_Do_Personal_Branding/EVENT_CHIRSTDO_2.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Brewing_up_with_Chris_Do_Personal_Branding/EVENT_CHIRSTDO_38.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Brewing_up_with_Chris_Do_Personal_Branding/EVENT_CHIRSTDO_46.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2024/Brewing_up_with_Chris_Do_Personal_Branding/EVENT_CHIRSTDO_61.JPG"]}}],"2025":[{"title":"5AM Eye-conic Hà Nội 2025","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/kv.jpg","year":"2025","category":"Experiential","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/kv.jpg","description":["5AM Eye-conic Hà Nội 2025 marks the return of Vietnam's first sunrise concert series, co-organized by Vietnam Airlines, SpaceSpeakers Group, and Vietcetera. Following successful runs in Ho Chi Minh City and Da Lat, Season 3 brings the \"Eye-conic\" spirit to Hanoi—a city where ancient heritage meets modern creative life in quiet harmony.","More than just a concert starting at 5 AM, the event invites participants to \"awaken\" the body, mind, and spirit through a holistic, two-part experience. Pre-Event Activities (lead-up to the concert) include immersive experiences like the Virtual Fun Run, the Heritage Race (exploring History, Culture, and Culinary tracks), and the Have A Sip Book Club. The On-Event Experience itself uniquely blends live music, movement, and cultural workshops, creating a unified space at dawn that offers a fresh, youthful perspective on Hanoi's inspiring rhythm."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no4.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no5.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no6.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no7.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no8.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no9.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no10.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no11.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no12.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no13.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no14.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no15.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/5am/no1.jpg"]}},{"title":"Vietcetera Open - Los Angeles 2025","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2025/vietcetera_open_LA/kv.jpg","year":"2025","category":"Tour","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2025/vietcetera_open_LA/kv.jpg","description":["Vietcetera Open LA 2025 is a half-day event spotlighting Vietnamese voices in the US, with stories of identity, creativity, and cultural impact on the global stage.","Aligning with Sketch A Rose - Hà Anh Tuấn Live Concert in LA, the first Vietnamese concert at the iconic venue Dolby Theatre, it marks a remarkable milestone for Vietnam’s presence on the global stage."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2025/vietcetera_open_LA/no1.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/vietcetera_open_LA/no2.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/vietcetera_open_LA/no3.jpg","https://img.vietcetera.com/uploads/images/event-credential/works/2025/vietcetera_open_LA/no4.jpg"]}},{"title":"Healthcare Summit 2025","img":"https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/kv.jpg","year":"2025","category":"Conference","detail":{"keyvisual":"https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/kv.jpg","description":["The Healthcare Summit 2025, hosted by Vietnam Innovators Digest with the theme \"Making Vietnam an Innovation Hub through Healthcare\", will serve as a dynamic convergence point for healthcare leaders, investors, policymakers, and innovators.","The focus will be on advancing healthcare innovation, investment, and accessibility, particularly through digital health solutions. We will explore how investment and innovation can accelerate healthcare transformation in Vietnam and beyond."],"landingPage":"","media":["https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no1.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no2.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no3.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no4.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no5.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no6.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no7.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no8.JPG","https://img.vietcetera.com/uploads/images/event-credential/works/2025/healthcare_summit_2025/no9.JPG"]}},{"title":"Vietcetera Open Japan 2025","img":"https://img.vietcetera.com/uploads/images/event-cred ,"img":"https://img.vietcetera.com/uploads/images/event-credential/aparts/3.jpg","description":"“On‑time, on‑budget, beyond expectation” is not a slogan—it’s the KPI we live by. Our commitment to the highest standards of production and execution means your event will be delivered on time, with unparalleled quality, and consistently exceeding expectations. We go the extra mile to ensure every element shines."},{"name":"One‑Stop Partner","img":"https://img.vietcetera.com/uploads/images/event-credential/aparts/4.jpg","description":"Strategy, concept, content, creative, production, PR \u0026 media, talent, and on‑ground execution - handled under one roof so you never juggle multiple agencies."},{"name":"High‑Performance People","img":"https://img.vietcetera.com/uploads/images/event-credential/aparts/5.JPG","description":"Our greatest asset is our people. Our high-performance team is dedicated to your specific requirements, bringing a wealth of intensive experience from both media and agency backgrounds. With strong English proficiency, we ensure clear communication and smooth collaboration throughout the entire process."},{"name":"Adaptive \u0026 Agile","img":"https://img.vietcetera.com/uploads/images/event-credential/aparts/6.jpg","description":"We understand that plans can evolve. Our team is inherently flexible and adaptive, providing swift and effective solutions to last-minute changes and requirements, ensuring your event remains on track and successful, no matter what."}]},"offers":{"title":"What We Offer","list":[{"name":"Concept Development \u0026 Strategy","img":"https://img.vietcetera.com/uploads/images/event-credential/offer/1.jpg","description":"We work closely with you to define your event's objectives, target audience, and key messages, developing a compelling concept that aligns with your brand."},{"name":"Creative \u0026 Content Production","img":"https://img.vietcetera.com/uploads/images/event-credential/offer/2.jpg","description":"Our team crafts engaging narratives, designs captivating visuals, and produces high-quality multimedia content to enhance the event experience."},{"name":"Logistics \u0026 Operations Management","img":"https://img.vietcetera.com/uploads/images/event-credential/offer/3.JPG","description":"From venue selection and vendor coordination to permits, technical support, and on-site logistics, we manage every operational detail."},{"name":"Marketing \u0026 Communications","img":"https://img.vietcetera.com/uploads/images/event-credential/offer/4.jpg","description":"We leverage our media expertise to develop comprehensive marketing and PR strategies, ensuring maximum exposure and attendance."},{"name":"Sponsorship \u0026 Partnership Activation","img":"https://img.vietcetera.com/uploads/images/event-credential/offer/5.jpg","description":"Identifying and securing valuable partnerships that enhance your event's profile and reach."},{"name":"Post-Event Reporting \u0026 Analysis","img":"https://img.vietcetera.com/uploads/images/event-credential/offer/6.jpg","description":"Providing detailed insights and analytics to measure success and inform future strategies."}]},"upcoming":{"title":"Upcoming","list":[{"name":"Flavors 2025: Bar week","img":"https://img.vietcetera.com/uploads/images/event-credential/upcoming/event_Flavors-1.jpg"},{"name":"Flavors 2025: Awards","img":"https://img.vietcetera.com/uploads/images/event-credential/upcoming/event_Flavors-2.jpg"},{"name":"Flavors 2025: Workshops","img":"https://img.vietcetera.com/uploads/images/event-credential/upcoming/event_Flavors-9.jpg"},{"name":"Flavors 2025: Conference","img":"https://img.vietcetera.com/uploads/images/event-credential/upcoming/event_Flavors-3.jpg"},{"name":"[VNID] Healthcare Summit 2025","img":"https://img.vietcetera.com/uploads/images/event-credential/upcoming/event_healthcare.jpg"},{"name":"[VNID] Asia Blueprint","img":"https://img.vietcetera.com/uploads/images/event-credential/upcoming/event_Asiablueprint-05.jpg"},{"name":"5AM Hanoi: The Eye-conic","img":"https://img.vietcetera.com/uploads/images/event-credential/upcoming/event_5AM.jpg"}]},"testimonials":{"title":"Testimonials","list":[{"name":"Daniel Stork","title":"Netherlands Consul General in Ho Chi Minh City, Vietnam","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/avatar1.png","description":"It was inspiring to see the \u003cstrong\u003e2025 ESG Investor Conference\u003c/strong\u003e proactively implement a sustainable event model with its technical partner Green Transition. This practical and action-focused demonstration reflects the kind of responsible approach the Netherlands champions with ESG. Supporting initiatives like this, which showcase a tangible commitment to ESG, is crucial as we encourage sustainable practices among businesses in Vietnam, an important partner for the Netherlands."},{"name":"Adrian Chong Yen","title":"Chef and Owner, Sol Kitchen \u0026 Bar","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/Chef Adrian Chong Yen.jpg","description":"I think the \u003cstrong\u003eFlavors Conference 2024\u003c/strong\u003e covered a broad base of F\u0026B and business aspects of things. It also covered important topics that people need to be aware of and understand the current climate of our industry. There were some top people here doing really amazing stuff, a lot of big brand owners at the event, CEO of a big hotel group, so it is interesting to hear their thoughts on the business and industry."},{"name":"Jovel Chan","title":"Singaporean Food and Drink Blogger | F\u0026B Consultant Ho Chi Minh City","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/avatar6.png","description":"Here is what the \u003cstrong\u003eFlavors Conference 2024\u003c/strong\u003e really taught me: It was really insightful, industry experts coming together and getting really into industry topics like never before."},{"name":"Ninh Tito","title":"Digital Content Creator | Food Blogger | Influencer","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/avatar5.png","description":"Ngày 06/12 vừa qua, Ninh đã có cơ hội trải nghiệm một buổi tối đầy cảm xúc tại sự kiện Chef Takeover 2024. Đây không chỉ đơn thuần là một bữa ăn, mà là hành trình khám phá sự hòa quyện tinh tế giữa ẩm thực Việt Nam và Quảng Đông qua bàn tay tài hoa của Chef Thái và Chef Summer Lê."},{"name":"Trieu Thanh Tinh","title":"Sustainability ESG Manager, Mobile World Investment Corporation (MWG)","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/MALE.png","description":"I'm impressed by how sustainability was integrated into the \u003cstrong\u003e2025 Vietnam ESG Investor conference\u003c/strong\u003e. From encouraging attendees to use public transportation, to eliminating plastic use, and even measuring participants' greenhouse gas emissions in real time. The event also provided opportunities for attendees to share their perspectives about sustainability impacts and take action to offset their emissions. I truly hope that more events in Vietnam will be organized sustainably like this in the future."},{"name":"Chiến Thắng","title":"Representative, FBVI Community","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/MALE.png","description":"Các buổi thảo luận tại \u003cstrong\u003eFlavors Conference 2024\u003c/strong\u003e không chỉ mang tính lý thuyết hoặc những kiến thức phổ biến. Các anh chị diễn giả đã chia sẻ kinh nghiệm chân thật, quá trình phát triển, cũng như là các case study thành công. Sự kiện đã truyền rất nhiều nguồn cảm hứng cho cộng đồng F\u0026B Việt Nam."},{"name":"Yuzu Omakase","title":"ゆずお任せ Ho Chi Minh","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/Yuzu.jpg","description":"It's such an honor for us to be recognized as Restaurant of The Year from \u003cstrong\u003eFlavors Collection 2024\u003c/strong\u003e of Vietcetera. We will keep leveraging our services to elevate the dining experience. Thank you for the love, trust and support of our dinners."},{"name":"Helen Le","title":"Food Blogger | Cookbook Author | Brand Ambassador","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/HELEN LE.jpg","description":"Helen rất vui và vinh dự khi được mời làm thành viên Hội đồng Giám Khảo của \u003cstrong\u003eFlavor Awards 2024\u003c/strong\u003e - một giải thưởng nhằm tôn vinh những sáng tạo và cống hiến xuất sắc nhất trong ngành F\u0026B. Đây là cơ hội tuyệt vời để chúng ta cùng nhau vinh danh những cá nhân, những thương hiệu và thành tựu đáng tự hào của ngành. Cảm ơn Vietcetera và Mastercard đã đồng hành tạo nên một sự kiện ý nghĩa kết nối cộng đồng F\u0026B, đồng thời mang đến cơ hội để các thương hiệu tỏa sáng."},{"name":"Nguyễn Hồ Trà My","title":"Influencer","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/FEMALE.png","description":"\u003cstrong\u003eThe Chef Takeover 2023\u003c/strong\u003e, hosted by Vietcetera, blends Malaysian and French flavors in a dazzling feast by Chefs Hoang Tung \u0026 Lee Zhe Xi... Each dish, a masterpiece; every sip, an experience."},{"name":"Lamai garden","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/Lamai.jpg","description":"Được xướng tên trong hạng mục nhà hàng của năm tại \u003cstrong\u003eFlavor Awards 2024\u003c/strong\u003e không chỉ là niềm vinh dự mà còn là động lực để Lamai tiếp tục hành trình khám phá ẩm thực Việt. Xin chân thành cảm ơn ban tổ chức Vietcetera, quý khách hàng, bạn bè, đồng nghiệp và toàn bộ tập thể team đã đồng hành cùng chúng tôi trong chặng đường vừa qua!"},{"name":"Nguyễn Hà Linh","title":"Influencer | Admin NGHIEN NHA Group | Founder Koh Yam Thai, HAOLA","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/avatar4.png","description":"Năm nay được cầm trên tay giải thưởng Nhà hàng được yêu thích nhất do khán giả bình chọn với đứa con tinh thần Koh Yam trong hành trình 10 năm đem ẩm thực đường phố Thái Lan đến gần mọi người hơn, cảm xúc rất gì và này nọ. Xin cám ơn Vietcetera và \u003cstrong\u003eFlavors Awards\u003c/strong\u003e năm nào cũng tâm huyết tổ chức sân chơi uy tín dành cho các anh em F\u0026B."},{"name":"Summer Le","title":"Founder, Executive Chef, Nén Danang \u0026 Nén Light Restaurant","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/avatar3.png","description":"An exciting night at Melia Hanoi's Cham Restaurant for \u003cstrong\u003eVietcetera's Chef Takeover\u003c/strong\u003e! It was such an interesting experience collaborating with Cham's talented team, blending my take on Vietnamese cuisine with their mastery of dim sum. Together, we created a unique culinary journey, celebrating creativity and the rich diversity of flavors. Thank you to everyone who joined us for this special event!"},{"name":"Khanh Ngo, CEO, Liobank by OCB","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/avatar2.png","description":"OV is always one of my favorites, because I think it's very well-organized, and the people that I meet here have become very, very good friends of mine. So I always look forward to attending and speaking."},{"name":"Tracy","title":"Co-founder, Vietnam - Australia Startups \u0026 Innovation Association","img":"https://img.vietcetera.com/uploads/images/event-credential/testimonials/FEMALE.png","description":"Tracy đã mua All-in Pass để có mặt liên tục trong 3 ngày ở sự kiện \u003cstrong\u003eOV Summit 2025\u003c/strong\u003e. Rất là vui và hào hứng. Tracy ở Úc cũng đã được hơn 10 năm và đây là cơ hội để Tracy được quay về, được trở lại, và được lắng nghe những thông tin thực tế, tình hình hiện tại và những cơ hội hiện nay vô cùng là hấp dẫn tại Việt Nam. Nếu mà các bạn còn cảm thấy chần chừ, không biết có nên quay về Việt Nam hay không thì những cơ hội tại sự kiện OV Summit 2025 là thời điểm tuyệt vời để các bạn có thể
