name \u0027j78ls_fk_acym_url_click_has_mail\u0027\u003Cbr\u003E\nForeign key j78ls_fk_acym_url_has_url not well set for table #\u003C\/strong\u003Eacym_url_click\u003Cbr\u003E\n[ERROR]Could not add the foreign key j78ls_fk_acym_url_has_url on the table #\u003Cstrong\u003Eacym_url_click : Duplicate foreign key constraint name \u0027j78ls_fk_acym_url_has_url\u0027\u003Cbr\u003E\nForeign key j78ls_fk_acym_condition1 not well set for table #\u003C\/strong\u003Eacym_condition\u003Cbr\u003E\n[ERROR]Could not add the foreign key j78ls_fk_acym_condition1 on the table #\u003Cstrong\u003Eacym_condition : Duplicate foreign key constraint name \u0027j78ls_fk_acym_condition1\u0027\u003Cbr\u003E\nForeign key j78ls_fk_acym_mail_has_followup1 not well set for table #\u003C\/strong\u003Eacym_followup_has_mail\u003Cbr\u003E\n[ERROR]Could not add the foreign key j78ls_fk_acym_mail_has_followup1 on the table #\u003Cstrong\u003Eacym_followup_has_mail : Duplicate foreign key constraint name \u0027j78ls_fk_acym_mail_has_followup1\u0027\u003Cbr\u003E\nForeign key j78ls_fk_acym_mail_has_followup2 not well set for table #\u003C\/strong\u003Eacym_followup_has_mail\u003Cbr\u003E\n[ERROR]Could not add the foreign key j78ls_fk_acym_mail_has_followup2 on the table #\u003Cstrong\u003Eacym_followup_has_mail : Duplicate foreign key constraint name \u0027j78ls_fk_acym_mail_has_followup2\u0027\u003Cbr\u003E\nForeign key j78ls_fk_acym_scenario_step1 not well set for table #\u003C\/strong\u003Eacym_scenario_step\u003Cbr\u003E\n[ERROR]Could not add the foreign key j78ls_fk_acym_scenario_step1 on the table #\u003Cstrong\u003Eacym_scenario_step : Duplicate foreign key constraint name \u0027j78ls_fk_acym_scenario_step1\u0027\u003Cbr\u003E\nForeign key j78ls_fk_acym_scenario_queue1 not well set for table #\u003C\/strong\u003Eacym_scenario_queue\u003Cbr\u003E\n[ERROR]Could not add the foreign key j78ls_fk_acym_scenario_queue1 on the table #__acym_scenario_queue : Duplicate foreign key constraint name \u0027j78ls_fk_acym_scenario_queue1\u0027\u003C\/p\u003E\n\n\u003Cp\u003ESince this is not the first time I observe this behaviour since updating AcyMailing Starter 10.10.2 -\u0026gt; 10.11.1 repeatedly. How to fix this?\u003C\/p\u003E\n\n\n\u003Cp\u003EAccess data to the site you can find in one of my previous tickets: \u003Ca href=\u0022https:\/\/www.joomlart.com\/forums\/d\/52728-translation-of-event-details\u0022 rel=\u0022ugc nofollow\u0022\u003Ehttps:\/\/www.joomlart.com\/forums\/d\/52728-translation-of-event-details\u003C\/a\u003E. Hope, you can help!\u003C\/p\u003E","renderFailed":false,"isSecret":false}},{"type":"posts","id":"241320","attributes":{"number":1,"createdAt":"2026-01-26T02:06:25+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EHello,\u003C\/p\u003E\n\n\u003Cp\u003EI\u2019m not a PHP developer, so I asked an AI assistant to help me draft this report in a clear and structured way.\u003Cbr\u003E\nThe following is an AI-assisted summary of the issue and the relevant findings.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003ESummary\u003C\/strong\u003E\u003Cbr\u003E\nOn a Joomla site using the T4 System Plugin + t4_bs5_blank template, the frontend fails with multiple PHP fatal errors such as:\u003Cbr\u003E\n\t\u2022\tUndefined constant \u0022T4\\Helper\\T4PATH_BASE\u0022\u003Cbr\u003E\n\t\u2022\tUndefined constant \u0022T4\\Helper\\T4PATH_LOCAL\u0022\u003Cbr\u003E\n\t\u2022\tUndefined constant \u0022T4\\Document\\T4PATH_BASE_URI\u0022\u003C\/p\u003E\n\n\u003Cp\u003ESwitching the site template to Cassiopeia avoids the error, so this appears to be specific to T4.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EEnvironment\u003C\/strong\u003E\u003Cbr\u003E\n\t\u2022\tJoomla: 5.4.2\u003Cbr\u003E\n\t\u2022\tPHP: 8.2.20\u003Cbr\u003E\n\t\u2022\tT4 System Plugin: 2.5.4\u003Cbr\u003E\n\t\u2022\tTemplate: t4_bs5_blank: 1.3.0\u003Cbr\u003E\n\t\u2022\tOther relevant extensions: Regular Labs System Plugin is enabled (seen in stack trace), but the crash happens inside T4 code before output.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EWhat happens (Actual behavior)\u003C\/strong\u003E\u003Cbr\u003E\nThe site throws a fatal error and stops rendering. Example stack traces:\u003Cbr\u003E\n\u003Cstrong\u003E1) Undefined constant T4PATH_BASE\u003C\/strong\u003E\u003C\/p\u003E\n\u003Cpre\u003E\u003Ccode\u003EException Type: Error\nFile: \/plugins\/system\/t4\/src\/t4\/Helper\/Asset.php\nMessage: Undefined constant \u0022T4\\Helper\\T4PATH_BASE\u0022\u003C\/code\u003E\u003Cscript async=\u0022\u0022 crossorigin=\u0022anonymous\u0022 data-hljs-style=\u0022github\u0022 integrity=\u0022sha384-fQc6882DqpMzcLWJbK07+Xnd8dceuG+q15iFvx+m\/bAzjiBJeLnbNfaiXYzJBEn\/\u0022 onload=\u0022hljsLoader.highlightBlocks(this.parentNode)\u0022 src=\u0022https:\/\/cdn.jsdelivr.net\/gh\/s9e\/hljs-loader@1.0.28\/loader.min.js\u0022\u003E\u003C\/script\u003E\u003C\/pre\u003E\n\u003Cp\u003E\u003Cstrong\u003E2) Undefined constant T4PATH_LOCAL\u003C\/strong\u003E\u003C\/p\u003E\n\u003Cpre\u003E\u003Ccode\u003EException Type: Error\nFile: \/plugins\/system\/t4\/src\/t4\/Helper\/Path.php\nMessage: Undefined constant \u0022T4\\Helper\\T4PATH_LOCAL\u0022\u003C\/code\u003E\u003Cscript async=\u0022\u0022 crossorigin=\u0022anonymous\u0022 data-hljs-style=\u0022github\u0022 integrity=\u0022sha384-fQc6882DqpMzcLWJbK07+Xnd8dceuG+q15iFvx+m\/bAzjiBJeLnbNfaiXYzJBEn\/\u0022 onload=\u0022hljsLoader.highlightBlocks(this.parentNode)\u0022 src=\u0022https:\/\/cdn.jsdelivr.net\/gh\/s9e\/hljs-loader@1.0.28\/loader.min.js\u0022\u003E\u003C\/script\u003E\u003C\/pre\u003E\n\n\u003Cp\u003E\u003Cstrong\u003E3) Undefined constant T4PATH_BASE_URI\u003C\/strong\u003E\u003C\/p\u003E\n\u003Cpre\u003E\u003Ccode\u003EException Type: Error\nFile: \/plugins\/system\/t4\/src\/t4\/Document\/Template.php\nLine: 203\nMessage: Undefined constant \u0022T4\\Document\\T4PATH_BASE_URI\u0022\u003C\/code\u003E\u003Cscript async=\u0022\u0022 crossorigin=\u0022anonymous\u0022 data-hljs-style=\u0022github\u0022 integrity=\u0022sha384-fQc6882DqpMzcLWJbK07+Xnd8dceuG+q15iFvx+m\/bAzjiBJeLnbNfaiXYzJBEn\/\u0022 onload=\u0022hljsLoader.highlightBlocks(this.parentNode)\u0022 src=\u0022https:\/\/cdn.jsdelivr.net\/gh\/s9e\/hljs-loader@1.0.28\/loader.min.js\u0022\u003E\u003C\/script\u003E\u003C\/pre\u003E\n\u003Cp\u003EIn Template.php, the fatal is triggered by this line inside renderHead():\u003C\/p\u003E\n\u003Cpre\u003E\u003Ccode\u003E$this-\u0026gt;doc-\u0026gt;addScript(T4PATH_BASE_URI . \u0027\/js\/base.js\u0027, [\u0027version\u0027 =\u0026gt; \u0027auto\u0027]);\u003C\/code\u003E\u003Cscript async=\u0022\u0022 crossorigin=\u0022anonymous\u0022 data-hljs-style=\u0022github\u0022 integrity=\u0022sha384-fQc6882DqpMzcLWJbK07+Xnd8dceuG+q15iFvx+m\/bAzjiBJeLnbNfaiXYzJBEn\/\u0022 onload=\u0022hljsLoader.highlightBlocks(this.parentNode)\u0022 src=\u0022https:\/\/cdn.jsdelivr.net\/gh\/s9e\/hljs-loader@1.0.28\/loader.min.js\u0022\u003E\u003C\/script\u003E\u003C\/pre\u003E\n\u003Cp\u003E\u003Cstrong\u003ETechnical analysis (why this looks like a T4 bug)\u003C\/strong\u003E\u003Cbr\u003E\nFrom the errors and the namespace-qualified constant names shown in the messages (e.g., T4\\Document\\T4PATH_BASE_URI), PHP is treating these as constants that are referenced before they are defined.\u003C\/p\u003E\n\n\u003Cp\u003EThis suggests either:\u003Cbr\u003E\n\t1.\tThe constants are not defined at all in this execution path, or\u003Cbr\u003E\n\t2.\tThe constants are defined somewhere in T4, but \u003Cstrong\u003Einitialization order \/ load order\u003C\/strong\u003E causes them to be referenced too early.\u003C\/p\u003E\n\n\u003Cp\u003EBecause multiple files fail in the same way (Asset.php, Path.php, Template.php), it looks systemic rather than a single typo.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003ETemporary workaround (not a real fix)\u003C\/strong\u003E\u003Cbr\u003E\nAs a temporary workaround, we can prevent the fatal by adding fallbacks like:\u003C\/p\u003E\n\u003Cpre\u003E\u003Ccode\u003E$t4BaseUri = defined(\u0027T4PATH_BASE_URI\u0027) ? T4PATH_BASE_URI : \\Joomla\\CMS\\Uri\\Uri::root(true);\u003C\/code\u003E\u003Cscript async=\u0022\u0022 crossorigin=\u0022anonymous\u0022 data-hljs-style=\u0022github\u0022 integrity=\u0022sha384-fQc6882DqpMzcLWJbK07+Xnd8dceuG+q15iFvx+m\/bAzjiBJeLnbNfaiXYzJBEn\/\u0022 onload=\u0022hljsLoader.highlightBlocks(this.parentNode)\u0022 src=\u0022https:\/\/cdn.jsdelivr.net\/gh\/s9e\/hljs-loader@1.0.28\/loader.min.js\u0022\u003E\u003C\/script\u003E\u003C\/pre\u003E\n\u003Cp\u003Eand replacing direct constant usage with the computed variables.\u003Cbr\u003E\nHowever, this is clearly not ideal: it is patching core plugin files and does not address the underlying cause.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003ERequest\u003C\/strong\u003E\u003Cbr\u003E\nCould you please:\u003Cbr\u003E\n\t1.\tConfirm where and when T4 defines the T4PATH\u003Cem\u003E* and T4PATH\u003C\/em\u003E*_URI constants, and\u003Cbr\u003E\n\t2.\tFix the initialization order (or always-define logic) so these constants are guaranteed to exist before T4 classes reference them?\u003C\/p\u003E\n\n\n\u003Cp\u003EThanks\u003C\/p\u003E","renderFailed":false,"isSecret":false}},{"type":"posts","id":"242208","attributes":{"number":1,"createdAt":"2026-04-17T07:27:06+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EI\u0027m interested in starting a Joomla 6 installation with T4 Page Builder, but I see there\u0027s no compatible version yet, and the last update was on December 20, 2023. Will T4 Page Builder continue to be maintained in the future?\u003C\/p\u003E","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243468","attributes":{"number":1,"createdAt":"2026-09-01T16:41:43+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EHello, i like to use for mobile and tablets offcanvas module. How can i hide main menu module in mobiles and tablets and not use for these two menus?\u003C\/p\u003E","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243493","attributes":{"number":1,"createdAt":"2026-09-03T20:52:49+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EIt looks like a JV6 compatible version of Ad Agency was released in August? Very confused, but happy if that\u0027s the case.\u003C\/p\u003E ","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243459","attributes":{"number":1,"createdAt":"2026-08-31T10:05:37+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EWill t4 blank template get dark mode soon?\u003C\/p\u003E","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243465","attributes":{"number":1,"createdAt":"2026-09-01T06:33:11+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EHello,\u003C\/p\u003E\n\n\u003Cp\u003EI\u0027m migrating a site from Joomla 5 to Joomla 6, using JA Healthcare (template v2.2.0) with T3 Framework 3.3.2. According to your compatibility page (joomla-status), JA Healthcare is listed as \u0022Stable\u0022 for Joomla 6, and a Joomla 6 quickstart package is available for download.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cimg src=\u0022https:\/\/www.joomlart.com\/forums\/assets\/files\/2026-09-01\/1788244350-450226-captura-de-pantalla-2026-09-01-082602.png\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/p\u003E\n\n\u003Cp\u003EHowever, the Joomla 6 update process requires disabling the \u0022Behavior - Backward Compatibility\u0022 plugin before running the updater. When I disable this plugin on my site, the frontend breaks with:\u003C\/p\u003E\n\n\u003Cp\u003EClass \u0022JObject\u0022 not found\u003C\/p\u003E\n\n\u003Cp\u003EI traced this to several files inside the T3 Framework itself, which still reference the legacy JObject class (removed in recent Joomla core versions) instead of \\Joomla\\CMS\\Object\\CMSObject:\u003C\/p\u003E\n\n\u003Cul\u003E\u003Cli\u003Eplugins\/system\/t3\/includes\/extendable\/object.4.php (line 16)\u003C\/li\u003E\n\u003Cli\u003Eplugins\/system\/t3\/includes\/extendable\/object.5.php (line 16)\u003C\/li\u003E\n\u003Cli\u003Eplugins\/system\/t3\/includes\/joomla25\/view.php (line 21)\u003C\/li\u003E\n\u003Cli\u003Eplugins\/system\/t3\/includes\/joomla25\/pagination.php (lines 20, 714)\u003C\/li\u003E\n\u003Cli\u003Eplugins\/system\/t3\/includes\/joomla30\/viewlegacy.php (line 21)\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003EI also found a related forum post (\u003Ca href=\u0022https:\/\/www.joomlart.com\/forums\/d\/47805-joomla-5\/8\u0022 rel=\u0022ugc nofollow\u0022\u003Ehttps:\/\/www.joomlart.com\/forums\/d\/47805-joomla-5\/8\u003C\/a\u003E) stating: \u0022With old templates based on T3 framework, we recommend not to disable Behavior - Backward Compatibility plugin.\u0022\u003C\/p\u003E\n\n\u003Cp\u003EThis raises a few questions for me:\u003C\/p\u003E\n\n\u003Col style=\u0022list-style-type:decimal\u0022\u003E\u003Cli\u003EIs JA Healthcare \/ T3 Framework 3.3.2 actually expected to work on Joomla 6 with the Backward Compatibility plugin disabled, or is keeping it enabled a known requirement?\u003C\/li\u003E\n\u003Cli\u003EIf it\u0027s a known requirement, could the compatibility status page mention this dependency, since \u0022Stable\u0022 support usually implies the site can run without legacy compatibility layers?\u003C\/li\u003E\n\u003Cli\u003EIs there a T3 Framework update planned that removes these JObject references and replaces them with the modern CMSObject class, so templates based on T3 can run cleanly on Joomla 6 without the compat plugin?\u003C\/li\u003E\u003C\/ol\u003E\n\n\u003Cp\u003EFor context, I already patched the JObject references above manually in my local install as a workaround, and I previously had to fix a similar casing issue with \\Joomla\\Component\\content\\Site\\Helper\\RouteHelper (lowercase \u0022content\u0022 instead of \u0022Content\u0022) in T3\u0027s com_content overrides.\u003C\/p\u003E\n\n\u003Cp\u003EAny clarification on the actual Joomla 6 readiness of T3 3.3.2 would be very helpful before I finalize this migration.\u003C\/p\u003E\n\n\u003Cp\u003EThank you,\u003Cbr\u003E\nCarlos\u003C\/p\u003E\n","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243450","attributes":{"number":1,"createdAt":"2026-08-28T13:20:32+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EI can clone the default template, rename the new style, but any changes to the new style seem to overwrite the default style. I\u2019m creating a site with three individually themed sections and their own branding. I\u0027ve created individual menus for the three sections. But am stuck with creating the individual styles which don\u0027t overwrite the default style. Default is called THC for short.\u003Cbr\u003E\nThanks for any suggestions.\u003Cbr\u003E\n\u003Cimg src=\u0022https:\/\/www.joomlart.com\/forums\/assets\/files\/2026-08-28\/1787923077-994545-img-0170.jpg\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cimg src=\u0022https:\/\/www.joomlart.com\/forums\/assets\/files\/2026-08-28\/1787923075-567253-img-0168.jpg\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/p\u003E\n\n","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243463","attributes":{"number":1,"createdAt":"2026-08-31T15:48:49+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EHi,\u003C\/p\u003E\n\n\u003Cp\u003EAfter upgrading a client site from Joomla 4.4.14 to 6.1.2 (and PHP 8.2 to 8.5), the Image add-on in T4 Page Builder can no longer pick a file through the Joomla Media Manager. Everything else in the builder works normally.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EEnvironment\u003C\/strong\u003E\u003C\/p\u003E\n\u003Cul\u003E\u003Cli\u003EJoomla: 6.1.3\u003C\/li\u003E\n\u003Cli\u003EPHP: 8.5.9\u003C\/li\u003E\n\u003Cli\u003ETemplate: ja_stark 2.2.0\u003C\/li\u003E\n\u003Cli\u003ET4 System Plugin: 2.6.2\u003C\/li\u003E\n\u003Cli\u003ET4 Page Builder Component: 2.2.0\u003C\/li\u003E\n\u003Cli\u003EServer: Linux \/ Apache under ISPConfig\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003E\u003Cstrong\u003ESteps to reproduce\u003C\/strong\u003E\u003C\/p\u003E\n\u003Col style=\u0022list-style-type:decimal\u0022\u003E\u003Cli\u003EOpen an article for editing with T4 Page Builder (in our case article id 208, \u0022Archivio Eventi\u0022).\u003C\/li\u003E\n\u003Cli\u003EFrom Add-ons \u0026gt; Basic, drag the \u003Cstrong\u003EImage\u003C\/strong\u003E add-on into an empty row.\u003C\/li\u003E\n\u003Cli\u003EThe \u003Cstrong\u003ESelect Image\u003C\/strong\u003E modal opens, showing the grid of already used images plus the URL field with the \u0022Add image\u0022 and \u0022Media\u0022 buttons.\u003C\/li\u003E\n\u003Cli\u003EClick \u003Cstrong\u003EMedia\u003C\/strong\u003E to open the Joomla Media Manager overlay.\u003C\/li\u003E\n\u003Cli\u003EBrowse to the folder \u003Ccode\u003Eimages\/didattica\u003C\/code\u003E and click the file \u003Ccode\u003Eheader-senti-chi-parla.jpg\u003C\/code\u003E, then click the \u003Cstrong\u003ESelect\u003C\/strong\u003E button.\u003C\/li\u003E\u003C\/ol\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EExpected result\u003C\/strong\u003E\u003Cbr\u003E\nThe Media Manager closes and the selected file is passed back to the Select Image modal, so it can be applied to the Image add-on.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EActual result\u003C\/strong\u003E\u003Cbr\u003E\nNothing happens: the Media Manager stays open and the Select button has no effect.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EBrowser console \/ network\u003C\/strong\u003E\u003Cbr\u003E\nNo JavaScript error is logged in the console and no failing request appears in the Network tab.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EAdditional information\u003C\/strong\u003E\u003C\/p\u003E\n\u003Cul\u003E\u003Cli\u003EThe Joomla Media Manager itself works correctly outside the builder: selecting an image through the standard article editor and through the \u0022Intro Image\u0022 field works as expected. The problem seems specific to the Select Image modal of the T4 Page Builder Image add-on on Joomla 6.\u003C\/li\u003E\n\u003Cli\u003EReproduced in a private browser window and with a second Super User account, so it is not a browser cache or extension issue.\u003C\/li\u003E\n\u003Cli\u003EThe same site worked correctly on Joomla 4.4.14 before the upgrade.\u003C\/li\u003E\n\u003Cli\u003EWorkaround currently in use: paste the public URL of the file into the Select Image field and confirm with \u0022Add image\u0022. This works reliably, but it is not a viable procedure for the site editors, who are non-technical museum staff.\u003C\/li\u003E\n\u003Cli\u003EA short screen recording of the whole flow is attached.\u003C\/li\u003E\u003C\/ul\u003E\n\n\u003Cp\u003ECould you confirm whether this is a known issue with Joomla 6.1.x, and whether a fix is already available in a newer release?\u003C\/p\u003E\n\n\u003Cp\u003EThanks in advance for your help.\u003C\/p\u003E","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243447","attributes":{"number":1,"createdAt":"2026-08-28T08:32:15+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EOn my site with joomla 5  with the template T3BS3 the features are show as Blog , but i install the T4BS5 and the features articles are not show as blog. \u003Cbr\u003E\nHave you a solution ?\u003C\/p\u003E\n","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243457","attributes":{"number":1,"createdAt":"2026-08-30T10:51:41+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EHi \u003Cbr\u003E\ni just want to ask, how do you edit the button \u0022Get Started\u0022 in the header it doesn\u0027t appear in the modules nor in the template styles layout? also i couldn\u0027t find \u0022Sign in\u0022 anywhere either?\u003C\/p\u003E","renderFailed":false,"isSecret":false}},{"type":"posts","id":"243456","attributes":{"number":1,"createdAt":"2026-08-29T14:21:18+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EHi,\u003C\/p\u003E\n\n\u003Cp\u003EI missed the renewal email and the code to for the discount. How can I get a new one?\u003C\/p\u003E","renderFailed":false,"isSecret":false}}]}}</script>
